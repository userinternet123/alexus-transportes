# SPVI Central: base de datos + aplicación + HTTPS automático (Caddy / Let's Encrypt)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: central
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U central"], interval: 10s, retries: 5 }

  central:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMINIO: "${DOMINIO}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    depends_on: [central]

volumes:
  datos:
  caddy:
