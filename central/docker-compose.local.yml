# SPVI Central en su PC, publicado con Tailscale (sin dominio ni servidor en la nube).
# Tailscale pone el HTTPS: aquí no hace falta Caddy. Central solo escucha en 127.0.0.1.
#   docker compose -f docker-compose.local.yml up -d --build
#   luego: publicar-tailscale.ps1 (Windows) o publicar-tailscale.sh (Linux)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: central
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U central"], interval: 10s, retries: 5 }

  central:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"] # solo este equipo; Tailscale lo publica

  # Túnel de Cloudflare: publica Central con su dominio, sin abrir puertos. Se activa con COMPOSE_PROFILES=cloudflare.
  # Las rutas (central.… y agentes.…) se configuran en el panel de Cloudflare apuntando a http://central:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on: [central]

volumes:
  datos:
